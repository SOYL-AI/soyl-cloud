name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# A second push to a PR cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Web ───────────────────────────────────────────────────────────────────
  web:
    name: Web — build, test, typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Blocking as of M1. `typescript.ignoreBuildErrors` is gone from
      # next.config.ts and the error count is zero — DECISIONS.md §5's sequence
      # is complete. If this fails, fix the type; do not re-add the flag.
      - name: Typecheck
        run: npm run typecheck

      # Still reporting only: 15 errors and 18 warnings of pre-existing lint
      # debt, none of it introduced by M0 or M1. Blocking this today would fail
      # every PR for reasons unrelated to the PR. Scheduled for M5 alongside the
      # accessibility work, which is where most of it lives.
      - name: Lint
        continue-on-error: true
        run: |
          set +e
          npx eslint --format stylish > lint.log 2>&1
          summary=$(grep -E "^.[0-9]+ problems?" lint.log | tail -1)
          {
            echo "## Lint"
            echo ""
            echo "**${summary:-no problems reported}**"
            echo ""
            echo '```'
            cat lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Lint::${summary:-no problems reported} — non-blocking until M5"
          exit 0

  # ── Lighthouse ────────────────────────────────────────────────────────────
  # UPDATE.md 12, M5: "Lighthouse >= 95 on SEO and >= 90 on performance for
  # every marketing route in CI."
  #
  # BLOCKING and passing: performance >= 90, SEO >= 95, accessibility >= 90,
  # best practices >= 90, CLS <= 0.05, TBT <= 300ms — on all eight routes.
  #
  # LCP remains a warning. It is 2.6-3.5s against the 2.0s criterion, and the
  # measurement is Lighthouse's *simulated* slow-4G value rather than an
  # observed one — the observed element render delay is 147ms. Reducing it
  # further means reducing bytes on the critical path, and BASELINE.md records
  # what is left to try. It is the one M5 criterion still unmet.
  lighthouse:
    name: Web — Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set, because production sets it. Measuring without analytics would
          # measure a site we do not ship.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: www.soyl.cloud

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.x autorun

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    name: API — migrations, tenant isolation, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # A real Postgres with pgvector, not SQLite. We depend on RLS, JSONB,
      # citext and vector types; none of them have a stand-in (UPDATE.md §13).
      postgres:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soyl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soyl"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      # Service containers cannot run the entrypoint init scripts, so the roles
      # are created by the step below from the same SQL the local stack uses.
      SOYL_ENVIRONMENT: local
      SOYL_DATABASE_URL: postgresql+asyncpg://soyl_app:soyl_app_local@localhost:5432/soyl
      SOYL_MIGRATION_DATABASE_URL: postgresql+asyncpg://soyl_migrator:soyl_migrator_local@localhost:5432/soyl
      SOYL_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/soyl
      SOYL_REDIS_URL: redis://localhost:6379/0
      SOYL_LEAD_INGEST_TOKEN: ci-lead-ingest-token-not-a-secret-value
      SOYL_STORAGE_ENDPOINT_URL: http://127.0.0.1:9000
      SOYL_STORAGE_BUCKET: soyl-documents
      SOYL_STORAGE_ACCESS_KEY: soyl-local
      SOYL_STORAGE_SECRET_KEY: soyl-local-secret
      # No Azure credentials in CI. The provider factory falls back to the
      # deterministic fake, and the tests that need the real endpoint are
      # marked `azure` and excluded by default.

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # Exactly the files docker/postgres runs locally. If these two drift, the
      # suite passes locally and fails here, or worse, the reverse.
      - name: Create extensions and roles
        working-directory: .
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d soyl -v ON_ERROR_STOP=1 -f docker/postgres/00-extensions.sql
          psql -h localhost -U postgres -d soyl -v ON_ERROR_STOP=1 -f docker/postgres/01-roles.sql

      # Not a service container: GitHub's `services:` cannot supply a command,
      # and MinIO needs `server /data` to start at all. A plain docker run can.
      # It is worth the extra step — the storage tests assert things a mock
      # gets wrong, like whether a signed content type is actually binding.
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=soyl-local             -e MINIO_ROOT_PASSWORD=soyl-local-secret             minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e             server /data
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      - name: Migrate
        run: uv run alembic upgrade head

      # BLOCKING, and deliberately not `continue-on-error`, not conditional,
      # and not marked skippable. UPDATE.md §6.2: a tenant isolation suite that
      # can be skipped is not a control. If the database is unreachable this
      # errors rather than skipping.
      - name: Tenant isolation suite
        run: uv run pytest tests/integration/test_tenant_isolation.py -q --strict-markers

      - name: All tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy soyl

      # The layering in docs/architecture/04-backend.md §21 is only real if
      # something checks it. Also the seam that keeps provider SDKs out of the
      # domain (UPDATE.md §6.9) once M4 adds one.
      - name: Architecture
        run: uv run lint-imports

      # The worker is a second process against the same image, so a broken
      # entrypoint would not surface anywhere else until a deploy.
      - name: Worker entrypoint imports
        run: uv run python -c "from soyl.infrastructure.queue.worker import WorkerSettings; print(WorkerSettings.functions)"

  # ── Migration reversibility ───────────────────────────────────────────────
  # UPDATE.md §13: "every migration reversible". A downgrade that has never
  # been run is a downgrade that does not work, and that is discovered during
  # an incident.
  migrations:
    name: Migrations are reversible
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soyl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soyl"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      SOYL_MIGRATION_DATABASE_URL: postgresql+asyncpg://soyl_migrator:soyl_migrator_local@localhost:5432/soyl

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: services/api
        run: uv sync --locked

      - name: Create extensions and roles
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d soyl -v ON_ERROR_STOP=1 -f docker/postgres/00-extensions.sql
          psql -h localhost -U postgres -d soyl -v ON_ERROR_STOP=1 -f docker/postgres/01-roles.sql

      - name: up, down, up
        working-directory: services/api
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
