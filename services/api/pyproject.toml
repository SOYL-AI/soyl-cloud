[project]
name = "soyl-api"
version = "0.1.0"
description = "SOYL Phase 0 API — identity, property and lead capture."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.128,<1.0",
    "uvicorn[standard]>=0.40,<1.0",
    "sqlalchemy[asyncio]>=2.0.44,<3.0",
    "asyncpg>=0.31,<1.0",
    "alembic>=1.17,<2.0",
    "pydantic[email]>=2.12,<3.0",
    "pydantic-settings>=2.13,<3.0",
    # Held at 5.x because arq pins redis<6. Nothing we use from redis-py needs
    # 6.x — the claims cache is get/set/incr/ping and aclose, all present since
    # 5.0.1 — so matching arq is cheaper than replacing the queue UPDATE.md §5
    # names. Revisit when arq widens its constraint.
    "redis>=5.0.1,<6.0",
    "structlog>=25.4,<26.0",
    # Argon2id, per UPDATE.md §5. The reference implementation's own bindings;
    # nothing else in the Python ecosystem is a serious alternative.
    "argon2-cffi>=25.1,<26.0",
    # Signs the short-lived service JWT the web app presents to this API.
    "pyjwt>=2.11,<3.0",
    # Google's token and userinfo endpoints. Already present as a test
    # dependency; promoted because the OAuth callback needs it at runtime.
    "httpx>=0.28,<1.0",
    # S3-compatible object storage. MinIO locally, R2 or equivalent in
    # production. Confined to soyl/infrastructure/storage/ so the Azure Blob
    # switch stays one file (UPDATE.md §5).
    "aioboto3>=15.5,<16.0",
    # The model provider SDK. Permitted, but only inside
    # soyl/infrastructure/providers/ — enforced by the import-linter contract
    # below rather than by anyone remembering (UPDATE.md §6.9).
    "openai>=2.9,<3.0",
    # Digital-native PDF extraction (UPDATE.md §8). Scanned documents need a
    # layout-aware OCR service, which is a later decision — this one refuses
    # them with a readable message rather than producing empty chunks.
    "pymupdf>=1.27,<2.0",
    # Token counting, so chunk sizes are measured in the unit the model
    # charges in rather than guessed from characters.
    "tiktoken>=0.13,<1.0",
    # The ingestion queue (UPDATE.md §5). Ingestion must not run in the
    # request path, and a 40-page PDF has two minutes to become queryable.
    "arq>=0.27,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.3,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.15,<1.0",
    "mypy>=1.19,<2.0",
    "import-linter>=2.4,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soyl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run. The engines are session-scoped, and a
# connection pool created on one loop cannot be used from another — which
# surfaces as "'NoneType' object has no attribute 'send'" from deep inside
# asyncpg rather than as anything resembling the actual problem.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# A test that is skipped is a test that is not protecting anything. The tenant
# isolation suite in particular must fail rather than skip when the database
# is unreachable (UPDATE.md §6.2), so skips are surfaced loudly.
addopts = "-ra --strict-markers --strict-config -m 'not azure'"
markers = [
    # Calls the real Azure endpoint and costs money. Excluded by default and
    # in CI, which has no credentials. Run with: pytest -m azure
    "azure: hits the real Azure OpenAI deployment",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "T20", "RUF"]
ignore = [
    # Assert is how pytest works.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated scaffolding has its own conventions, and migration 001
# builds DDL strings from a fixed table list — no user input reaches them.
"alembic/**" = ["E501", "I001", "S608"]
# The provider check is a command-line tool: printing is its entire output, and
# it builds DDL from names it generated itself.
"scripts/*.py" = ["T201", "S608", "E501"]
# Test fixtures use literal local-development passwords on purpose, and build
# SQL from a parametrised list of table names that is defined in the file.
"tests/**" = ["S105", "S106", "S608", "E501"]
# The retrieval eval is a command-line tool whose entire output is printed, and
# the report is a fixed-width table that reads worse wrapped than long.
"evals/**" = ["T201", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
# Third-party packages without stubs; failing on those is noise, not signal.
ignore_missing_imports = true

[tool.importlinter]
root_package = "soyl"
# Required to forbid an *external* package such as `openai`; without it
# import-linter only reasons about first-party modules and the §6.9 contract
# cannot be expressed at all.
include_external_packages = true

# ── Layering, per docs/architecture/04-backend.md §21 ──
# interface → application → domain → (nothing)
# infrastructure implements ports the domain declares, so it may import domain,
# but nothing in domain may reach back into infrastructure.
[[tool.importlinter.contracts]]
name = "Layers are respected"
type = "layers"
layers = [
    "soyl.interface",
    "soyl.application",
    "soyl.domain",
]

# UPDATE.md §6.9, made enforceable. The seam is worth nothing if a provider
# SDK can be imported from a use case, and this is the check that notices.
[[tool.importlinter.contracts]]
name = "Provider SDKs live only in the provider adapter layer"
type = "forbidden"
source_modules = [
    "soyl.domain",
    "soyl.application",
    "soyl.interface",
    "soyl.infrastructure.db",
    "soyl.infrastructure.storage",
]
forbidden_modules = ["openai"]

[[tool.importlinter.contracts]]
name = "The domain does not know how it is stored or served"
type = "forbidden"
source_modules = ["soyl.domain"]
forbidden_modules = [
    "soyl.infrastructure",
    "soyl.interface",
    "soyl.application",
]

[tool.uv]
package = true
