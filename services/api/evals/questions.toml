#  The labelled retrieval set — 40 question/chunk pairs, plus the probes.
#
#  Read evals/README.md before changing anything here. In particular: questions
#  are written in the words an operator would use, never the document's words.
#  A question that borrows the document's phrasing measures nothing, because
#  lexical search will find it whatever the rest of the pipeline does.
#
#  `answers` names a *section of a document*, not a chunk id. Chunk ids are
#  regenerated on every ingest and chunk boundaries move whenever the chunker is
#  tuned, so a set labelled by id would rot on the first change to §43.1. The
#  harness resolves a section to whichever chunk carries it — including one it
#  was merged into — and fails loudly if it cannot, which is what stops a
#  renamed heading from quietly scoring zero.
#
#  Tags:
#    vocabulary-gap  the question and the answer share almost no words
#    exact-identifier a contract number or a code; lexical search's job
#    multi-chunk     more than one section is genuinely needed
#    near-miss       a similar-sounding section elsewhere is the wrong answer
#    numeric         the answer is a threshold, a limit or a deadline
#    procedural      "what do I do if…"

