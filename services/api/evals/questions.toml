#  ── Probes ──────────────────────────────────────────────────────────────────
#
#  Questions the corpus genuinely does not answer. These are not scored for
#  recall or precision; the only correct behaviour is to retrieve nothing and
#  say so.
#
#  `UPDATE.md` §M4: "asking something genuinely not covered by the corpus
#  produces an honest 'I don't have that' rather than a confident invention.
#  **Test the last one deliberately and often.**"
#
#  Half of these are deliberately near-misses — a strongly related section
#  exists and does not answer the question. Those are the ones that will fail
#  first, and they are the ones worth failing on, because a plausible wrong
#  answer is the expensive kind.

[[probe]]
id = "p01"
text = "what is the wifi password for the conference room"
note = "nothing in the corpus concerns network access"

[[probe]]
id = "p02"
text = "how many rooms does the munnar property have"
note = "the properties are named throughout but never counted"

[[probe]]
id = "p03"
text = "what commission does booking.com charge us"
tags = ["near-miss"]
note = "near-miss: section 6 of the commercial policy gives the ten per cent travel agent commission, which is a different arrangement. Answering ten per cent here would be a confident invention"

[[probe]]
id = "p04"
text = "are guests allowed to bring dogs"
tags = ["near-miss"]
note = "near-miss: housekeeping mentions an animal found in a room as something to report, which is not a pet policy"

[[probe]]
id = "p05"
text = "what time does the spa open"
tags = ["near-miss"]
note = "near-miss: outlet hours are given for every other outlet, so the shape of the answer exists and the answer does not"

[[probe]]
id = "p06"
text = "what was our occupancy last march"
note = "no operating data anywhere in the corpus"

[[probe]]
id = "p07"
text = "can guests smoke on their balcony"
tags = ["near-miss"]
note = "near-miss: housekeeping lists signs of smoking as a thing to report, and the ashtrays in the smoking area are mentioned; neither is a smoking policy"

[[probe]]
id = "p08"
text = "how much is the airport pickup"
tags = ["near-miss"]
note = "near-miss: staff transport is covered in the people policy, guest transport is not"

[[probe]]
id = "p09"
text = "who is the fire officer at the kochi property"
tags = ["near-miss"]
note = "near-miss: the safety plan refers to the senior fire officer repeatedly, as a role at an incident, and names nobody"

[[probe]]
id = "p10"
text = "do we accept american express"
note = "card authorisation is covered, card schemes are not"

[[probe]]
id = "p11"
text = "what is the cancellation policy for a spa booking"
tags = ["near-miss"]
note = "near-miss: three separate cancellation scales exist in the corpus — rooms, corporate rooms and banquets. None is this one, and picking the closest is the failure mode this probe exists to catch"

[[probe]]
id = "p12"
text = "how do i reset the television in a guest room"
tags = ["near-miss"]
note = "near-miss: the quarterly room inspection lists the television, which is not a fault procedure"
